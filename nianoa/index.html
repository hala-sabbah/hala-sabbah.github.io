<html lang="en">

<title>Private presentation</title>

<style>
:root{--ink:#1E1B18;--paper:#F4F0EA;--ember:#E0A06A;--line:#3A342E}
html,body{margin:0;height:100%;background:#141210;color:var(--paper);font-family:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:40px;line-height:1.1}
.gate p{margin:0;color:#CFC6BB;font-size:15px;line-height:1.5}
.gate label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#CFC6BB;margin-top:8px}
.gate input{font:inherit;font-size:16px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:#1E1B18;color:var(--paper)}
.gate input:focus{outline:2px solid var(--ember);outline-offset:1px}
.gate button{font:inherit;font-weight:600;font-size:15px;padding:12px 14px;border:0;border-radius:6px;background:var(--ember);color:#1E1B18;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .error{color:#F0A08A;min-height:1.4em;font-size:14px}
body.open .gate{display:none}
.viewer{display:none;position:fixed;inset:0;overflow:hidden}
body.open .viewer{display:block}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.deck-slide{position:absolute;inset:0;display:none}
.deck-slide.active{display:block}
.deck-slide section{position:relative;width:1920px;height:1080px;overflow:hidden;margin:0}
.deck-slide aside{display:none}
.deck-slide:not(.active) .rise,.deck-slide:not(.active) .fade{animation:none}
.deck-slide p,.deck-slide h1,.deck-slide h2,.deck-slide h3,.deck-slide table{margin:0}
.deck-slide table{border-collapse:separate;border-spacing:0 6px}
.deck-slide img{display:block}
.deck-slide img.loading{visibility:hidden}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;opacity:0;transition:opacity .25s;pointer-events:none}
.viewer:hover .bar,.bar:focus-within,body.touch .bar{opacity:1;pointer-events:auto}
.bar button{font:inherit;font-size:14px;background:rgba(30,27,24,.85);color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.bar .count{font-size:14px;color:#CFC6BB;min-width:64px;text-align:center;background:rgba(30,27,24,.85);border-radius:999px;padding:8px 12px}
.vnotes{position:fixed;left:16px;right:16px;bottom:64px;max-width:900px;margin:0 auto;background:rgba(20,18,16,.94);border:1px solid var(--line);border-radius:10px;padding:16px 20px;font-size:16px;line-height:1.55;color:#E9E1D6;display:none}
body.show-notes .vnotes{display:block}
</style>
</head>
<body>
<section class="gate" aria-labelledby="gate-title">
  <form id="gate-form">
    <h1 id="gate-title">Private presentation</h1>
    <p>This presentation is private. Enter the password you received to open it.</p>
    <label for="gate-password">Password</label>
    <input id="gate-password" type="password" autocomplete="current-password" required>
    <button type="submit">Open</button>
    <p class="error" id="gate-error" role="alert"></p>
    <noscript><p>Please turn on JavaScript to open this presentation.</p></noscript>
  </form>
</section>
<div class="viewer" aria-live="polite">
  <div class="stage" id="stage"></div>
  <div class="vnotes" id="notes"></div>
  <div class="bar">
    <button type="button" id="prev" aria-label="Previous slide">&larr;</button>
    <span class="count" id="count"></span>
    <button type="button" id="next" aria-label="Next slide">&rarr;</button>
    <button type="button" id="notes-btn" aria-label="Show speaker notes">Notes</button>
    <button type="button" id="full" aria-label="Full screen">Full screen</button>
  </div>
</div>

<script>
(function () {
  var payload = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate-form'), input = document.getElementById('gate-password'), error = document.getElementById('gate-error');
  var STORE = 'nianoa-deck-key', key = null, deck = null, cur = 0, slides = [], cache = {};
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(buf) { var s = ''; new Uint8Array(buf).forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s); }
  function deriveKey(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(payload.salt), iterations: payload.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function decrypt(k, iv, data) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, data); }
  function asset(id) {
    if (cache[id]) return cache[id];
    var a = deck.assets[id];
    cache[id] = fetch(a.file).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      return decrypt(key, new Uint8Array(buf.slice(0, 12)), buf.slice(12));
    }).then(function (plain) { return URL.createObjectURL(new Blob([plain], { type: a.type })); });
    return cache[id];
  }
  function loadSlide(i) {
    if (i < 0 || i >= slides.length) return;
    slides[i].querySelectorAll('img[data-asset]').forEach(function (img) {
      if (img.dataset.done) return; img.dataset.done = '1';
      asset(img.dataset.asset).then(function (u) { img.src = u; img.classList.remove('loading'); });
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var st = document.getElementById('stage');
    st.style.transform = 'scale(' + s + ') translate(-50%,-50%)';
  }
  function show(i, push) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (el, n) { el.classList.toggle('active', n === i); });
    cur = i; loadSlide(i); loadSlide(i + 1); loadSlide(i - 1);
    document.getElementById('count').textContent = (i + 1) + ' / ' + slides.length;
    var aside = slides[i].querySelector('aside');
    document.getElementById('notes').textContent = aside ? aside.textContent : '';
    if (push !== false) history.replaceState(null, '', '#' + (i + 1));
  }
  function build() {
    document.getElementById('deck-css').textContent = deck.css;
    document.title = deck.title;
    var stage = document.getElementById('stage');
    deck.slides.forEach(function (html) {
      var d = document.createElement('div'); d.className = 'deck-slide';
      d.innerHTML = html.replace(/src="\/_blob\/([0-9a-f]{32})"/g, 'data-asset="$1"');
      stage.appendChild(d); slides.push(d);
    });
    slides.forEach(function (d) { d.querySelectorAll('img[data-asset]').forEach(function (img) { img.classList.add('loading'); }); });
    document.body.classList.add('open');
    fit(); window.addEventListener('resize', fit);
    var start = parseInt((location.hash || '').slice(1), 10);
    show(isNaN(start) ? 0 : start - 1, false);
    // warm up the rest in the background
    setTimeout(function () { slides.forEach(function (_, n) { loadSlide(n); }); }, 1500);
    document.getElementById('prev').onclick = function () { show(cur - 1); };
    document.getElementById('next').onclick = function () { show(cur + 1); };
    document.getElementById('notes-btn').onclick = function () { document.body.classList.toggle('show-notes'); };
    document.getElementById('full').onclick = toggleFull;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
      else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
      else if (e.key === 'f' || e.key === 'F') toggleFull();
      else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
    });
    var x0 = null;
    document.getElementById('stage').parentNode.addEventListener('touchstart', function (e) { document.body.classList.add('touch'); x0 = e.touches[0].clientX; }, { passive: true });
    document.getElementById('stage').parentNode.addEventListener('touchend', function (e) {
      if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
    });
    document.getElementById('stage').addEventListener('click', function (e) {
      if (e.target.closest('a')) return;
      show(cur + (e.clientX > window.innerWidth / 2 ? 1 : -1));
    });
  }
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  function unlock(k, remember) {
    return decrypt(k, b64(payload.iv), b64(payload.ct)).then(function (plain) {
      key = k; deck = JSON.parse(new TextDecoder().decode(plain));
      if (remember) crypto.subtle.exportKey('raw', k).then(function (raw) { try { sessionStorage.setItem(STORE, toB64(raw)); } catch (e) {} });
      build();
    });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); error.textContent = '';
    var btn = form.querySelector('button'); btn.disabled = true;
    deriveKey(input.value).then(function (k) { return unlock(k, true); }).catch(function () {
      error.textContent = 'That password is not right. Please try again.'; input.select();
    }).then(function () { btn.disabled = false; });
  });
  var saved = null; try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']).then(function (k) { return unlock(k, false); })
      .catch(function () { try { sessionStorage.removeItem(STORE); } catch (e) {} input.focus(); });
  } else { input.focus(); }
})();
</script>
